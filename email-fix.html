<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Form Fix - REISEZIEL KROATIEN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #fff;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        button {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(33, 150, 243, 0.3);
        }
        
        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            display: none;
        }
        
        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
        }
        
        .status.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
        }
        
        .debug {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            display: none;
        }
        
        .debug.show {
            display: block;
        }
        
        .error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        input.error, select.error, textarea.error {
            border: 2px solid #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏖️ REISEZIEL KROATIEN</h1>
        <p class="subtitle">Kontakt forma - Email test verzija</p>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Ime i prezime *</label>
                <input type="text" id="name" name="name" required>
                <div class="error" id="name-error">Molimo unesite vaše ime</div>
            </div>
            
            <div class="form-group">
                <label for="email">Email adresa *</label>
                <input type="email" id="email" name="email" required>
                <div class="error" id="email-error">Molimo unesite ispravnu email adresu</div>
            </div>
            
            <div class="form-group">
                <label for="phone">Telefon</label>
                <input type="tel" id="phone" name="phone">
            </div>
            
            <div class="form-group">
                <label for="property">Apartman *</label>
                <select id="property" name="property" required>
                    <option value="">Odaberite apartman</option>
                    <option value="AP1 - Lavendelgarten 1">AP1 - Lavendelgarten 1</option>
                    <option value="AP2 - Luxurious">AP2 - Luxurious</option>
                    <option value="AP3 - Modern">AP3 - Modern</option>
                    <option value="AP4 - Cozy">AP4 - Cozy</option>
                    <option value="AP5 - Family">AP5 - Family</option>
                    <option value="AP6 - Premium">AP6 - Premium</option>
                </select>
                <div class="error" id="property-error">Molimo odaberite apartman</div>
            </div>
            
            <div class="form-group">
                <label for="checkIn">Datum dolaska *</label>
                <input type="date" id="checkIn" name="checkIn" required>
                <div class="error" id="checkIn-error">Molimo odaberite datum dolaska</div>
            </div>
            
            <div class="form-group">
                <label for="checkOut">Datum odlaska *</label>
                <input type="date" id="checkOut" name="checkOut" required>
                <div class="error" id="checkOut-error">Molimo odaberite datum odlaska</div>
            </div>
            
            <div class="form-group">
                <label for="guests">Broj gostiju</label>
                <input type="number" id="guests" name="guests" min="1" max="10" placeholder="1-10">
            </div>
            
            <div class="form-group">
                <label for="message">Poruka *</label>
                <textarea id="message" name="message" required placeholder="Opišite vaše potrebe..."></textarea>
                <div class="error" id="message-error">Molimo unesite poruku</div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-primary" id="sendEmail">📧 Otvorite email client</button>
                <button type="button" class="btn-secondary" id="copyData">📋 Kopiraj podatke</button>
            </div>
        </form>
        
        <div id="status" class="status"></div>
        <div id="debug" class="debug"></div>
    </div>

    <script>
        // Email functions
        function generateEmailLink(formData) {
            console.log('📧 Generating email link with form data:', formData);
            
            const subject = encodeURIComponent(`Neue Buchung - ${formData.name}`);
            
            const body = encodeURIComponent(`Neue Buchung von der Website:

Name: ${formData.name}
E-Mail: ${formData.email}
${formData.phone ? `Telefon: ${formData.phone}` : ''}
Ferienwohnung: ${formData.property}
Ankunftsdatum: ${formData.checkIn}
Abfahrtsdatum: ${formData.checkOut}
${formData.guests ? `Anzahl der Gäste: ${formData.guests}` : ''}

Nachricht:
${formData.message}

---
Gesendet von der REISEZIEL KROATIEN Website`);
            
            const emailLink = `mailto:info@reiseziel-kroatien.de?subject=${subject}&body=${body}`;
            
            console.log('📧 Generated email link:', emailLink);
            console.log('📧 Email link length:', emailLink.length);
            console.log('📧 Decoded body preview:', decodeURIComponent(body));
            
            return emailLink;
        }
        
        function sendEmailDirectly(formData) {
            try {
                const emailLink = generateEmailLink(formData);
                window.open(emailLink, '_blank');
                return true;
            } catch (error) {
                console.error('Failed to open email client:', error);
                return false;
            }
        }
        
        function copyEmailData(formData) {
            const emailText = `Neue Buchung:

Name: ${formData.name}
E-Mail: ${formData.email}
${formData.phone ? `Telefon: ${formData.phone}` : ''}
Ferienwohnung: ${formData.property}
Ankunftsdatum: ${formData.checkIn}
Abfahrtsdatum: ${formData.checkOut}
${formData.guests ? `Anzahl der Gäste: ${formData.guests}` : ''}

Nachricht:
${formData.message}`;
            
            navigator.clipboard.writeText(emailText).then(() => {
                showStatus('✅ Podaci su kopirani u clipboard!', 'success');
            }).catch(() => {
                showStatus('❌ Greška pri kopiranju podataka', 'error');
            });
        }
        
        // Form validation
        function validateForm() {
            const form = document.getElementById('contactForm');
            const formData = new FormData(form);
            let isValid = true;
            
            // Clear previous errors
            document.querySelectorAll('.error').forEach(error => {
                error.classList.remove('show');
                error.previousElementSibling.classList.remove('error');
            });
            
            // Required fields
            const requiredFields = ['name', 'email', 'property', 'checkIn', 'checkOut', 'message'];
            
            requiredFields.forEach(fieldName => {
                const field = document.getElementById(fieldName);
                const value = formData.get(fieldName);
                
                if (!value || value.trim() === '') {
                    field.classList.add('error');
                    document.getElementById(`${fieldName}-error`).classList.add('show');
                    isValid = false;
                }
            });
            
            // Email validation
            const email = formData.get('email');
            if (email && !isValidEmail(email)) {
                document.getElementById('email').classList.add('error');
                document.getElementById('email-error').textContent = 'Molimo unesite ispravnu email adresu';
                document.getElementById('email-error').classList.add('show');
                isValid = false;
            }
            
            // Date validation
            const checkIn = new Date(formData.get('checkIn'));
            const checkOut = new Date(formData.get('checkOut'));
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            if (formData.get('checkIn') && checkIn < today) {
                document.getElementById('checkIn').classList.add('error');
                document.getElementById('checkIn-error').textContent = 'Datum dolaska mora biti u budućnosti';
                document.getElementById('checkIn-error').classList.add('show');
                isValid = false;
            }
            
            if (formData.get('checkOut') && checkOut <= checkIn) {
                document.getElementById('checkOut').classList.add('error');
                document.getElementById('checkOut-error').textContent = 'Datum odlaska mora biti nakon datuma dolaska';
                document.getElementById('checkOut-error').classList.add('show');
                isValid = false;
            }
            
            return isValid;
        }
        
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function getFormData() {
            const form = document.getElementById('contactForm');
            const formData = new FormData(form);
            
            return {
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                property: formData.get('property'),
                checkIn: formData.get('checkIn'),
                checkOut: formData.get('checkOut'),
                guests: formData.get('guests'),
                message: formData.get('message'),
                language: 'de'
            };
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 5000);
        }
        
        function showDebug(info) {
            const debug = document.getElementById('debug');
            debug.textContent = JSON.stringify(info, null, 2);
            debug.classList.add('show');
        }
        
        // Event listeners
        document.getElementById('sendEmail').addEventListener('click', function() {
            if (validateForm()) {
                const formData = getFormData();
                showDebug(formData);
                
                if (sendEmailDirectly(formData)) {
                    showStatus('✅ Email client je otvoren! Provjerite vašu email aplikaciju.', 'success');
                } else {
                    showStatus('❌ Greška pri otvaranju email client-a', 'error');
                }
            } else {
                showStatus('❌ Molimo ispravite greške u formi', 'error');
            }
        });
        
        document.getElementById('copyData').addEventListener('click', function() {
            if (validateForm()) {
                const formData = getFormData();
                copyEmailData(formData);
            } else {
                showStatus('❌ Molimo ispravite greške u formi', 'error');
            }
        });
        
        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('checkIn').setAttribute('min', today);
        document.getElementById('checkOut').setAttribute('min', today);
        
        // Update checkout minimum when checkin changes
        document.getElementById('checkIn').addEventListener('change', function() {
            document.getElementById('checkOut').setAttribute('min', this.value);
        });
        
        // Real-time validation
        document.querySelectorAll('input, select, textarea').forEach(field => {
            field.addEventListener('blur', function() {
                if (this.hasAttribute('required') && !this.value.trim()) {
                    this.classList.add('error');
                    const errorElement = document.getElementById(`${this.name}-error`);
                    if (errorElement) {
                        errorElement.classList.add('show');
                    }
                } else {
                    this.classList.remove('error');
                    const errorElement = document.getElementById(`${this.name}-error`);
                    if (errorElement) {
                        errorElement.classList.remove('show');
                    }
                }
            });
            
            field.addEventListener('input', function() {
                this.classList.remove('error');
                const errorElement = document.getElementById(`${this.name}-error`);
                if (errorElement) {
                    errorElement.classList.remove('show');
                }
            });
        });
        
        // Initialize
        console.log('📧 Email form initialized');
        showStatus('✅ Forma je spremna za korištenje!', 'success');
    </script>
</body>
</html>
