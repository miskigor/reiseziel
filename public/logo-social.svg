<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="50" fill="#fbbf24" opacity="0.3"/>
  <circle cx="1100" cy="530" r="80" fill="#fbbf24" opacity="0.2"/>
  <circle cx="200" cy="500" r="30" fill="#fbbf24" opacity="0.4"/>
  
  <!-- Main house -->
  <g transform="translate(150, 200)">
    <!-- House base -->
    <path d="M0 200 L100 150 L200 200 L200 300 L0 300 Z" fill="url(#houseGradient)" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Roof -->
    <path d="M-20 200 L100 140 L220 200 L200 200 L100 150 L0 200 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="3"/>
    
    <!-- Door -->
    <rect x="85" y="250" width="30" height="50" fill="#92400e" stroke="#78350f" stroke-width="2"/>
    
    <!-- Windows -->
    <rect x="30" y="220" width="25" height="25" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
    <rect x="145" y="220" width="25" height="25" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Window frames -->
    <line x1="42.5" y1="220" x2="42.5" y2="245" stroke="#0284c7" stroke-width="1"/>
    <line x1="30" y1="232.5" x2="55" y2="232.5" stroke="#0284c7" stroke-width="1"/>
    <line x1="157.5" y1="220" x2="157.5" y2="245" stroke="#0284c7" stroke-width="1"/>
    <line x1="145" y1="232.5" x2="170" y2="232.5" stroke="#0284c7" stroke-width="1"/>
  </g>
  
  <!-- Palm trees -->
  <g transform="translate(300, 150)">
    <!-- Palm trunk -->
    <rect x="0" y="0" width="20" height="200" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    
    <!-- Palm leaves -->
    <path d="M10 0 Q-30 20 10 40 Q50 20 10 0" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <path d="M10 0 Q-20 30 10 50 Q40 30 10 0" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <path d="M10 0 Q-40 10 10 30 Q60 10 10 0" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <path d="M10 0 Q-10 40 10 60 Q30 40 10 0" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  </g>
  
  <!-- Second palm tree -->
  <g transform="translate(450, 180)">
    <rect x="0" y="0" width="15" height="150" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <path d="M7.5 0 Q-25 15 7.5 30 Q40 15 7.5 0" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <path d="M7.5 0 Q-15 25 7.5 40 Q30 25 7.5 0" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <path d="M7.5 0 Q-30 5 7.5 20 Q45 5 7.5 0" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  </g>
  
  <!-- Sun -->
  <g transform="translate(900, 80)">
    <circle cx="0" cy="0" r="40" fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>
    <path d="M0 -60 L0 -50 M0 50 L0 60 M-60 0 L-50 0 M50 0 L60 0 M-42 -42 L-35 -35 M35 -35 L42 -42 M-42 42 L-35 35 M35 35 L42 42" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    REISEZIEL KROATIEN
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="36" font-weight="normal" fill="#fbbf24" text-anchor="middle">
    FERIENHÄUSER & APPARTEMENTS
  </text>
  
  <!-- Location -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="28" font-weight="normal" fill="white" text-anchor="middle" opacity="0.9">
    Bilice • Šibenik • Kroatien
  </text>
  
  <!-- Decorative line -->
  <line x1="400" y1="350" x2="800" y2="350" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Features -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="white" text-anchor="middle" opacity="0.8">
    ✨ Luxuriöse Ferienwohnungen • Schwimmbad • 🌊 Adriatisches Meer
  </text>
  
  <!-- Website -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#fbbf24" text-anchor="middle">
    www.reiseziel-kroatien.de
  </text>
</svg>