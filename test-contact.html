<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Contact Form</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Test Contact Form</h1>
    <p>Ovo je test stranica za provjeru email forme.</p>
    
    <form id="testForm">
        <div class="form-group">
            <label for="name">Ime:</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="property">Apartman:</label>
            <select id="property" name="property" required>
                <option value="">Odaberite apartman</option>
                <option value="ap1">AP1</option>
                <option value="ap2">AP2</option>
                <option value="ap3">AP3</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="checkin">Check-in:</label>
            <input type="date" id="checkin" name="checkin" required>
        </div>
        
        <div class="form-group">
            <label for="checkout">Check-out:</label>
            <input type="date" id="checkout" name="checkout" required>
        </div>
        
        <div class="form-group">
            <label for="message">Poruka:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
        </div>
        
        <button type="submit">Pošalji</button>
    </form>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Forma radi! Podaci su validni.');
        });
    </script>
</body>
</html>
