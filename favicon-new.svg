<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="30" fill="#fbbf24" opacity="0.3"/>
  <circle cx="432" cy="432" r="40" fill="#fbbf24" opacity="0.2"/>
  <circle cx="120" cy="400" r="20" fill="#fbbf24" opacity="0.4"/>
  
  <!-- Main house (centered) -->
  <g transform="translate(156, 180)">
    <!-- House base -->
    <path d="M0 120 L80 80 L160 120 L160 200 L0 200 Z" fill="url(#houseGradient)" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Roof -->
    <path d="M-15 120 L80 70 L175 120 L160 120 L80 80 L0 120 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="65" y="160" width="30" height="40" fill="#92400e" stroke="#78350f" stroke-width="1"/>
    
    <!-- Windows -->
    <rect x="20" y="140" width="25" height="25" fill="#0ea5e9" stroke="#0284c7" stroke-width="1"/>
    <rect x="115" y="140" width="25" height="25" fill="#0ea5e9" stroke="#0284c7" stroke-width="1"/>
    
    <!-- Window frames -->
    <line x1="32.5" y1="140" x2="32.5" y2="165" stroke="#0284c7" stroke-width="0.5"/>
    <line x1="20" y1="152.5" x2="45" y2="152.5" stroke="#0284c7" stroke-width="0.5"/>
    <line x1="127.5" y1="140" x2="127.5" y2="165" stroke="#0284c7" stroke-width="0.5"/>
    <line x1="115" y1="152.5" x2="140" y2="152.5" stroke="#0284c7" stroke-width="0.5"/>
  </g>
  
  <!-- Palm trees -->
  <g transform="translate(280, 160)">
    <!-- Palm trunk -->
    <rect x="0" y="0" width="12" height="120" fill="#16a34a" stroke="#15803d" stroke-width="1"/>
    
    <!-- Palm leaves -->
    <path d="M6 0 Q-20 15 6 30 Q32 15 6 0" fill="#16a34a" stroke="#15803d" stroke-width="1"/>
    <path d="M6 0 Q-12 20 6 35 Q24 20 6 0" fill="#16a34a" stroke="#15803d" stroke-width="1"/>
    <path d="M6 0 Q-25 8 6 23 Q37 8 6 0" fill="#16a34a" stroke="#15803d" stroke-width="1"/>
  </g>
  
  <!-- Sun -->
  <g transform="translate(400, 80)">
    <circle cx="0" cy="0" r="25" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <path d="M0 -35 L0 -30 M0 30 L0 35 M-35 0 L-30 0 M30 0 L35 0 M-25 -25 L-22 -22 M22 -22 L25 -25 M-25 25 L-22 22 M22 22 L25 25" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Main title -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">
    REISEZIEL
  </text>
  
  <!-- Subtitle -->
  <text x="256" y="350" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#fbbf24" text-anchor="middle">
    KROATIEN
  </text>
  
  <!-- Location -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="white" text-anchor="middle" opacity="0.9">
    Bilice • Šibenik
  </text>
</svg>
